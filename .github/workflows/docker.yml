name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Supersede stale PR runs; each push keeps its own workflow run.
concurrency:
  group: ${{ github.workflow }}-run-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    uses: ./.github/workflows/e2e.yml

  docker:
    name: Build container
    needs: tests
    # Keep the latest check and push together under one publication lock.
    # Queue releases instead of replacing the previous pending release.
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref_type == 'tag' && 'releases' || github.ref }}
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release policy
        run: python3 -m unittest discover -s .github/scripts -v

      - name: Validate publishing configuration
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo '::error::Set the DOCKERHUB_USERNAME repository variable.'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo '::error::Set the DOCKERHUB_TOKEN repository secret.'; exit 1; }

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/release.py validate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether latest can advance
        id: release
        if: github.ref_type == 'tag'
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/tasker', vars.DOCKERHUB_USERNAME) }}
        run: python3 .github/scripts/release.py promote

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/tasker', vars.DOCKERHUB_USERNAME || 'tasker') }}
          tags: |
            type=edge,branch=main
            type=sha,format=long
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
          flavor: latest=false

      - name: Build image for smoke check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: tasker:ci-check
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check container configuration, metrics, and bind-mount storage
        run: bash .github/scripts/smoke-container.sh tasker:ci-check

      - name: Publish checked image
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
